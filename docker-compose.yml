services:
  api:
    build: .
    container_name: sportshunter-ai-api
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite:////app/data/sports_hunter.db
      LOG_FILE: /app/logs/sports_hunter.log
      DATA_PROVIDER: ${DATA_PROVIDER:-free}
      FOOTBALL_DATA_SOURCE: ${FOOTBALL_DATA_SOURCE:-free}
      FOOTBALL_DATA_SEASON: ${FOOTBALL_DATA_SEASON:-2026}
      FREE_PROVIDER_SOURCES: ${FREE_PROVIDER_SOURCES:-espn,thesportsdb}
      FREE_PROVIDER_BASE_URL: ${FREE_PROVIDER_BASE_URL:-https://site.api.espn.com}
      FREE_PROVIDER_THESPORTSDB_BASE_URL: ${FREE_PROVIDER_THESPORTSDB_BASE_URL:-https://www.thesportsdb.com/api/v1/json/3}
      FREE_PROVIDER_FOOTBALL_LEAGUES: ${FREE_PROVIDER_FOOTBALL_LEAGUES:-eng.1,eng.2,eng.3,eng.4,eng.5,eng.fa,eng.fa_qual,eng.league_cup,eng.trophy,eng.charity,esp.1,esp.2,esp.copa_del_rey,esp.super_cup,ita.1,ita.2,ita.coppa_italia,ita.super_cup,ger.1,ger.2,ger.dfb_pokal,ger.super_cup,fra.1,fra.2,fra.coupe_de_france,fra.super_cup,por.1,por.taca.portugal,ned.1,ned.2,ned.cup,ned.supercup,sco.1,sco.2,sco.tennents,sco.cis,sco.challenge,bel.1,sui.1,aut.1,den.1,nor.1,swe.1,pol.1,tur.1,gre.1,rus.1,uefa.champions,uefa.champions_qual,uefa.europa,uefa.europa_qual,uefa.europa.conf,uefa.europa.conf_qual,uefa.super_cup,uefa.nations,uefa.euro,uefa.euroq,fifa.world,fifa.wwc,fifa.cwc,fifa.worldq.uefa,fifa.worldq.conmebol,fifa.worldq.concacaf,fifa.worldq.afc,fifa.worldq.caf,fifa.worldq.ofc,fifa.friendly,fifa.friendly.w,fifa.friendly_u21,fifa.world.u20,fifa.world.u17,club.friendly,nonfifa,conmebol.libertadores,conmebol.sudamericana,conmebol.america,concacaf.champions,concacaf.champions_cup,concacaf.gold,concacaf.nations.league,afc.champions,afc.cup,afc.asian.cup,aff.championship,caf.champions,caf.confed,caf.w.nations,kor.1,kor.2,jpn.1,jpn.2,aus.1,chn.1,idn.1,tha.1,sgp.1,ind.1,ind.2,ksa.1,isr.1,rsa.1,bra.1,bra.2,bra.copa_do_brazil,bra.camp.carioca,bra.camp.paulista,bra.camp.gaucho,bra.camp.mineiro,arg.1,arg.2,arg.3,arg.copa,usa.1,usa.nwsl,usa.open,usa.usl.1,usa.usl.l1,mex.1,mex.2,col.1,col.copa,ecu.1,per.1,uru.1,uru.2,chi.1,par.1,bol.1,ven.1,hon.1,crc.1,gua.1,slv.1}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PUSH_ENABLED: ${TELEGRAM_PUSH_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - sportshunter_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  telegram_bot:
    build: .
    container_name: sportshunter-ai-telegram
    profiles:
      - telegram
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite:////app/data/sports_hunter.db
      LOG_FILE: /app/logs/sports_hunter.log
      DATA_PROVIDER: ${DATA_PROVIDER:-free}
      FOOTBALL_DATA_SOURCE: ${FOOTBALL_DATA_SOURCE:-free}
      FOOTBALL_DATA_SEASON: ${FOOTBALL_DATA_SEASON:-2026}
      FREE_PROVIDER_SOURCES: ${FREE_PROVIDER_SOURCES:-espn,thesportsdb}
      FREE_PROVIDER_BASE_URL: ${FREE_PROVIDER_BASE_URL:-https://site.api.espn.com}
      FREE_PROVIDER_THESPORTSDB_BASE_URL: ${FREE_PROVIDER_THESPORTSDB_BASE_URL:-https://www.thesportsdb.com/api/v1/json/3}
      FREE_PROVIDER_FOOTBALL_LEAGUES: ${FREE_PROVIDER_FOOTBALL_LEAGUES:-eng.1,eng.2,eng.3,eng.4,eng.5,eng.fa,eng.fa_qual,eng.league_cup,eng.trophy,eng.charity,esp.1,esp.2,esp.copa_del_rey,esp.super_cup,ita.1,ita.2,ita.coppa_italia,ita.super_cup,ger.1,ger.2,ger.dfb_pokal,ger.super_cup,fra.1,fra.2,fra.coupe_de_france,fra.super_cup,por.1,por.taca.portugal,ned.1,ned.2,ned.cup,ned.supercup,sco.1,sco.2,sco.tennents,sco.cis,sco.challenge,bel.1,sui.1,aut.1,den.1,nor.1,swe.1,pol.1,tur.1,gre.1,rus.1,uefa.champions,uefa.champions_qual,uefa.europa,uefa.europa_qual,uefa.europa.conf,uefa.europa.conf_qual,uefa.super_cup,uefa.nations,uefa.euro,uefa.euroq,fifa.world,fifa.wwc,fifa.cwc,fifa.worldq.uefa,fifa.worldq.conmebol,fifa.worldq.concacaf,fifa.worldq.afc,fifa.worldq.caf,fifa.worldq.ofc,fifa.friendly,fifa.friendly.w,fifa.friendly_u21,fifa.world.u20,fifa.world.u17,club.friendly,nonfifa,conmebol.libertadores,conmebol.sudamericana,conmebol.america,concacaf.champions,concacaf.champions_cup,concacaf.gold,concacaf.nations.league,afc.champions,afc.cup,afc.asian.cup,aff.championship,caf.champions,caf.confed,caf.w.nations,kor.1,kor.2,jpn.1,jpn.2,aus.1,chn.1,idn.1,tha.1,sgp.1,ind.1,ind.2,ksa.1,isr.1,rsa.1,bra.1,bra.2,bra.copa_do_brazil,bra.camp.carioca,bra.camp.paulista,bra.camp.gaucho,bra.camp.mineiro,arg.1,arg.2,arg.3,arg.copa,usa.1,usa.nwsl,usa.open,usa.usl.1,usa.usl.l1,mex.1,mex.2,col.1,col.copa,ecu.1,per.1,uru.1,uru.2,chi.1,par.1,bol.1,ven.1,hon.1,crc.1,gua.1,slv.1}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PUSH_ENABLED: ${TELEGRAM_PUSH_ENABLED:-false}
    command: ["python", "-m", "telegram_bot.bot"]
    volumes:
      - sportshunter_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  sportshunter_data:
