services:
  api:
    build: .
    container_name: sportshunter-ai-api
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite:////app/data/sports_hunter.db
      LOG_FILE: /app/logs/sports_hunter.log
      DATA_PROVIDER: ${DATA_PROVIDER:-free}
      FOOTBALL_DATA_SOURCE: ${FOOTBALL_DATA_SOURCE:-free}
      FOOTBALL_DATA_SEASON: ${FOOTBALL_DATA_SEASON:-2026}
      FREE_PROVIDER_BASE_URL: ${FREE_PROVIDER_BASE_URL:-https://site.api.espn.com}
      FREE_PROVIDER_FOOTBALL_LEAGUES: ${FREE_PROVIDER_FOOTBALL_LEAGUES:-eng.1,esp.1,ita.1,ger.1,fra.1,uefa.champions,uefa.europa,uefa.europa.conf,fifa.world,usa.1,mex.1,por.1,ned.1,bra.1,bra.2,arg.1}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PUSH_ENABLED: ${TELEGRAM_PUSH_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - sportshunter_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  telegram_bot:
    build: .
    container_name: sportshunter-ai-telegram
    profiles:
      - telegram
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite:////app/data/sports_hunter.db
      LOG_FILE: /app/logs/sports_hunter.log
      DATA_PROVIDER: ${DATA_PROVIDER:-free}
      FOOTBALL_DATA_SOURCE: ${FOOTBALL_DATA_SOURCE:-free}
      FOOTBALL_DATA_SEASON: ${FOOTBALL_DATA_SEASON:-2026}
      FREE_PROVIDER_BASE_URL: ${FREE_PROVIDER_BASE_URL:-https://site.api.espn.com}
      FREE_PROVIDER_FOOTBALL_LEAGUES: ${FREE_PROVIDER_FOOTBALL_LEAGUES:-eng.1,esp.1,ita.1,ger.1,fra.1,uefa.champions,uefa.europa,uefa.europa.conf,fifa.world,usa.1,mex.1,por.1,ned.1,bra.1,bra.2,arg.1}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PUSH_ENABLED: ${TELEGRAM_PUSH_ENABLED:-false}
    command: ["python", "-m", "telegram_bot.bot"]
    volumes:
      - sportshunter_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  sportshunter_data:
