services:
  api:
    build: .
    container_name: sportshunter-ai-api
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite:////app/data/sports_hunter.db
      LOG_FILE: /app/logs/sports_hunter.log
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PUSH_ENABLED: ${TELEGRAM_PUSH_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - sportshunter_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  telegram_bot:
    build: .
    container_name: sportshunter-ai-telegram
    profiles:
      - telegram
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite:////app/data/sports_hunter.db
      LOG_FILE: /app/logs/sports_hunter.log
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PUSH_ENABLED: ${TELEGRAM_PUSH_ENABLED:-false}
    command: ["python", "-m", "telegram_bot.bot"]
    volumes:
      - sportshunter_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  sportshunter_data:
