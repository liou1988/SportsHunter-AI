      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      THE_ODDS_API_BASE_URL: ${THE_ODDS_API_BASE_URL:-https://api.the-odds-api.com}
      THE_ODDS_API_REGIONS: ${THE_ODDS_API_REGIONS:-uk,eu}
      THE_ODDS_API_BOOKMAKERS: ${THE_ODDS_API_BOOKMAKERS:-}
      THE_ODDS_API_MARKETS: ${THE_ODDS_API_MARKETS:-h2h,spreads,totals}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      API_FOOTBALL_LIVE_ODDS_ENABLED: ${API_FOOTBALL_LIVE_ODDS_ENABLED:-true}
      API_FOOTBALL_LIVE_INCLUDE_PREMATCH: ${API_FOOTBALL_LIVE_INCLUDE_PREMATCH:-false}
      API_FOOTBALL_PREMATCH_WINDOW_MINUTES: ${API_FOOTBALL_PREMATCH_WINDOW_MINUTES:-90}
      API_FOOTBALL_PREMATCH_GRACE_MINUTES: ${API_FOOTBALL_PREMATCH_GRACE_MINUTES:-10}
      API_FOOTBALL_PREMATCH_CACHE_TTL_SECONDS: ${API_FOOTBALL_PREMATCH_CACHE_TTL_SECONDS:-1800}
      API_FOOTBALL_LIVE_CACHE_TTL_SECONDS: ${API_FOOTBALL_LIVE_CACHE_TTL_SECONDS:-300}
      API_FOOTBALL_BOOKMAKER_IDS: ${API_FOOTBALL_BOOKMAKER_IDS:-}
      API_FOOTBALL_BET_IDS: ${API_FOOTBALL_BET_IDS:-}
      API_FOOTBALL_ODDS_MAX_PAGES: ${API_FOOTBALL_ODDS_MAX_PAGES:-1}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PUSH_ENABLED: ${TELEGRAM_PUSH_ENABLED:-false}
      TELEGRAM_ALERT_SIGNALS: ${TELEGRAM_ALERT_SIGNALS:-STRONG_BUY,BUY,WATCH}
      TELEGRAM_ALERT_INTERVAL_MINUTES: ${TELEGRAM_ALERT_INTERVAL_MINUTES:-5}
      TELEGRAM_ALERT_RETENTION_DAYS: ${TELEGRAM_ALERT_RETENTION_DAYS:-7}
      TELEGRAM_ALERT_ARCHIVE_PATH: ${TELEGRAM_ALERT_ARCHIVE_PATH:-/app/reports/telegram_alerts.json}
      RECOMMENDATION_GATE_ENABLED: ${RECOMMENDATION_GATE_ENABLED:-true}
      RECOMMENDATION_ALLOWED_SIGNALS: ${RECOMMENDATION_ALLOWED_SIGNALS:-WATCH,BUY,STRONG_BUY}
      RECOMMENDATION_MIN_SCORE: ${RECOMMENDATION_MIN_SCORE:-62}
      RECOMMENDATION_MIN_CONFIDENCE: ${RECOMMENDATION_MIN_CONFIDENCE:-0.60}
      RECOMMENDATION_PREMATCH_MIN_MINUTES: ${RECOMMENDATION_PREMATCH_MIN_MINUTES:-15}
      RECOMMENDATION_PREMATCH_MAX_MINUTES: ${RECOMMENDATION_PREMATCH_MAX_MINUTES:-360}
      RECOMMENDATION_REQUIRE_ODDS: ${RECOMMENDATION_REQUIRE_ODDS:-true}
      RECOMMENDATION_REQUIRE_FRESH_ODDS: ${RECOMMENDATION_REQUIRE_FRESH_ODDS:-true}
      RECOMMENDATION_MAX_ODDS_AGE_MINUTES: ${RECOMMENDATION_MAX_ODDS_AGE_MINUTES:-120}
      RECOMMENDATION_MIN_BOOKMAKERS: ${RECOMMENDATION_MIN_BOOKMAKERS:-1}
      RECOMMENDATION_REQUIRE_SHARP_ANCHOR: ${RECOMMENDATION_REQUIRE_SHARP_ANCHOR:-false}
      RECOMMENDATION_MIN_MARKET_EDGE: ${RECOMMENDATION_MIN_MARKET_EDGE:-0.04}
      RECOMMENDATION_MIN_EXPECTED_VALUE: ${RECOMMENDATION_MIN_EXPECTED_VALUE:-0}
      RECOMMENDATION_LEAGUE_REVIEW_DAYS: ${RECOMMENDATION_LEAGUE_REVIEW_DAYS:-15}
      RECOMMENDATION_LEAGUE_MIN_SAMPLES: ${RECOMMENDATION_LEAGUE_MIN_SAMPLES:-20}
      RECOMMENDATION_LEAGUE_MIN_HIT_RATE: ${RECOMMENDATION_LEAGUE_MIN_HIT_RATE:-0.40}
      RECOMMENDATION_LEAGUE_MIN_ROI: ${RECOMMENDATION_LEAGUE_MIN_ROI:--0.30}
      MODEL_OPTIMIZER_ENABLED: ${MODEL_OPTIMIZER_ENABLED:-true}
      MODEL_OPTIMIZER_CHECK_HOUR: ${MODEL_OPTIMIZER_CHECK_HOUR:-1}
      MODEL_OPTIMIZER_CHECK_MINUTE: ${MODEL_OPTIMIZER_CHECK_MINUTE:-20}
      MODEL_OPTIMIZER_MANUAL_MIN_SAMPLES: ${MODEL_OPTIMIZER_MANUAL_MIN_SAMPLES:-20}
      MODEL_OPTIMIZER_AUTO_APPLY_ENABLED: ${MODEL_OPTIMIZER_AUTO_APPLY_ENABLED:-true}
      MODEL_OPTIMIZER_AUTO_APPLY_MIN_SAMPLES: ${MODEL_OPTIMIZER_AUTO_APPLY_MIN_SAMPLES:-100}
      MODEL_OPTIMIZER_STATUS_PATH: ${MODEL_OPTIMIZER_STATUS_PATH:-/app/reports/model_optimizer_status.json}
    ports:
      - "8000:8000"
    volumes:
      - sportshunter_data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

